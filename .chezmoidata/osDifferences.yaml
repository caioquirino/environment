osDifferences:
  darwin:
    ssh_agent_1password_enabled: true
    ssh_agent_1password_path: "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
    gpg_ssh_1password_path: "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
    antidote_path: "/opt/homebrew/opt/antidote/share/antidote/antidote.zsh"
    pnpm_home: "$HOME/Library/pnpm"
    jetbrains_toolbox_scripts_path: "$HOME/Library/Application Support/JetBrains/Toolbox/scripts"
    android_sdk_home_path: "$HOME/Library/Android/sdk"
  linux-arch-wsl2:
    ssh_agent_1password_enabled: false
    ssh_agent_1password_path: "<<disabled>>"
    gpg_ssh_1password_path: "/mnt/c/Users/<Username>/AppData/Local/Microsoft/WindowsApps/op-ssh-sign-wsl.exe"
    antidote_path: "/usr/share/zsh-antidote/antidote.zsh"
    pnpm_home: "$HOME/.local/share/pnpm"
    jetbrains_toolbox_scripts_path: "$HOME/.local/share/JetBrains/Toolbox/scripts"
    android_sdk_home_path: "$HOME/Android/Sdk"
  linux-arch:
    ssh_agent_1password_enabled: true
    ssh_agent_1password_path: "~/.1password/agent.sock"
    gpg_ssh_1password_path: "/opt/1Password/op-ssh-sign"
    antidote_path: "/usr/share/zsh-antidote/antidote.zsh"
    pnpm_home: "$HOME/.local/share/pnpm"
    jetbrains_toolbox_scripts_path: "$HOME/.local/share/JetBrains/Toolbox/scripts"
    android_sdk_home_path: "$HOME/Android/Sdk"
