console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = '   {{ .Path }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#ff479c'
    type = 'path'
    style = 'powerline'

    [blocks.segments.properties]
      style = 'unique'
      max_depth = 3

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = '#193549'
    powerline_symbol = ''
    background = '#fffb38'
    type = 'git'
    style = 'powerline'
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}#FF9248{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}', '{{ if gt .Ahead 0 }}#B388FF{{ end }}', '{{ if gt .Behind 0 }}#B388FF{{ end }}']

  [[blocks.segments]]
    template = '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#6CA35E'
    type = 'node'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#111111'
    powerline_symbol = ''
    background = '#8ED1F7'
    type = 'go'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#111111'
    powerline_symbol = ''
    background = '#4063D8'
    type = 'julia'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#111111'
    powerline_symbol = ''
    background = '#FFDE57'
    type = 'python'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#AE1401'
    type = 'ruby'
    style = 'powerline'

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#FEAC19'
    type = 'azfunc'
    style = 'powerline'

  [[blocks.segments]]
    template = '  '
    foreground = '#111111'
    powerline_symbol = ''
    background = '#ffff66'
    type = 'root'
    style = 'powerline'

  [[blocks.segments]]
    template = '<transparent></>  {{ .FormattedMs }}⠀'
    foreground = '#ffffff'
    background = '#83769c'
    type = 'executiontime'
    style = 'plain'

  [[blocks.segments]]
    trailing_diamond = ''
    template = '<parentBackground></>  '
    foreground = '#ffffff'
    background = '#00897b'
    type = 'status'
    style = 'diamond'
    background_templates = ['{{ if gt .Code 0 }}#e91e63{{ end }}']

[[blocks.segments]]
  leading_diamond = ''
  trailing_diamond = ' '
  template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = '#ffffff'
  background = '#0e8ac8'
  type = 'java'
  style = 'diamond'
[[blocks.segments]]
  leading_diamond = ''
  trailing_diamond = ' '
  template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = '#925837'
  background = '#f3f0ec'
  type = 'rust'
  style = 'diamond'
[[blocks.segments]]
  template = '  {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
  foreground = '#111111'
  powerline_symbol = ''
  background = '#1BD760'
  type = 'ytm'
  style = 'powerline'
[[blocks.segments]]
  leading_diamond = ''
  trailing_diamond = ''
  template = ' {{ .CurrentDate | date .Format }} '
  foreground = '#111111'
  background = '#2e9599'
  type = 'time'
  style = 'diamond'
